schema_version = "1.0.0"

id = "leviate"
# Version of the add-on, raised only when the add-on changes. A blender-v<version> tag
# publishes it in a release of its own; the apps keep their own version.
version = "1.3.9"
name = "Leviate"
tagline = "Move the 3D view or objects with your hands, webcam or phone"
maintainer = "Vladyslav Pereverzyev"
type = "add-on"
website = "https://github.com/vladpereverzyev/leviate/tree/main/integrations/blender"

tags = ["3D View", "User Interface"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Vladyslav Pereverzyev", "2026 Kalyan (gesture idea from kelyonn/vertex)"]

# Filled in by scripts/build-blender.py for each platform zip.
# platforms = []
# wheels = []

[permissions]
camera = "Reads the webcam to follow your hand, nothing is recorded"
network = "Phone pairing via PeerJS, hand model download on first start"
clipboard = "Copies the phone pairing link"
