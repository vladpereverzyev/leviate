#
# Builds the Blender zips, the desktop app (Windows, macOS, Linux) and the Chrome extension
# on every push and pull request. Releases are separate, so each one changes only when it has changed. Both
# are tagged v<version>; the number tells which one it is:
#   the version of shared/js/version.js            Leviate for Desktop, marked as the latest
#   the version of the add-on (blender_manifest)   Leviate for Blender, never marked latest,
#                                                   so the update check of the app finds the app
# The web app itself is not in a release: it runs from https://vladpereverzyev.github.io/leviate/.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  # Checks the syntax of the JavaScript first (every other job waits for this one), then,
  # on a tag: is it the version of the desktop app or of the Blender add-on?
  kind:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.kind.outputs.desktop }}
      blender: ${{ steps.kind.outputs.blender }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check the JavaScript
        run: node --experimental-vm-modules scripts/check.mjs

      - name: Which release
        id: kind
        run: |
          APP="v$(grep -oP "VERSION = '\K[0-9.]+" shared/js/version.js)"
          ADDON="v$(grep -oP '^version = "\K[0-9.]+' integrations/blender/leviate/blender_manifest.toml)"
          DESKTOP=false; BLENDER=false
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then DESKTOP=true; BLENDER=true; fi
          if [ "$GITHUB_REF_NAME" = "$APP" ]; then DESKTOP=true; fi
          if [ "$GITHUB_REF_NAME" = "$ADDON" ]; then BLENDER=true; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$DESKTOP$BLENDER" = "falsefalse" ]; then
            echo "Tag $GITHUB_REF_NAME matches neither the app ($APP) nor the add-on ($ADDON)"
            exit 1
          fi
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "blender=$BLENDER" >> "$GITHUB_OUTPUT"

  build:
    needs: [kind]
    if: needs.kind.outputs.blender == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the add-on code
        run: python -m py_compile integrations/blender/leviate/*.py

      - name: Build Leviate for Blender
        run: python scripts/build-blender.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: integrations
          path: dist/*.zip
          if-no-files-found: error

  desktop:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      # macOS: the dmg is signed with the Developer ID certificate (MAC_CERTS) and notarized
      # by Apple, so it opens with no "Open Anyway". Without the secrets it stays unsigned.
      - name: Developer ID keychain
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        id: devid
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          [ -n "$MAC_CERTS" ] || { echo "No MAC_CERTS: unsigned build"; exit 0; }
          KC="$RUNNER_TEMP/devid.keychain"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"Developer ID Application: \(.*\)".*/\1/p' | head -1)
          [ -n "$ID" ] || { echo "No Developer ID Application identity in MAC_CERTS: unsigned build"; exit 0; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"

      - name: Build Leviate for Desktop
        if: steps.devid.outputs.identity == ''
        run: node scripts/build-desktop.mjs

      - name: Build Leviate for Desktop (signed and notarized)
        if: steps.devid.outputs.identity != ''
        env:
          CSC_KEYCHAIN: ${{ steps.devid.outputs.keychain }}
          APPLE_API_KEY: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          node scripts/build-desktop.mjs
          "-c.mac.identity=${{ steps.devid.outputs.identity }}"
          -c.mac.hardenedRuntime=true
          -c.mac.entitlements=packaging/mac/entitlements.mac.plist
          -c.mac.entitlementsInherit=packaging/mac/entitlements.mac.plist
          -c.mac.notarize=true

      - name: Remove the signing secrets from the runner
        if: always() && runner.os == 'macOS'
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/devid.keychain" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/leviate-*.exe
            dist/desktop/leviate-*.dmg
            dist/desktop/leviate-*.AppImage
          if-no-files-found: error

  # The Linux app as a Flatpak bundle too (desktop/packaging/linux/io.github.vladpereverzyev.leviate.yml),
  # installed with a double click or flatpak install --user leviate-<version>-linux-x64.flatpak.
  flatpak:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build the Linux app
        run: node scripts/build-desktop.mjs --dir

      - name: Version
        id: version
        run: echo "version=$(grep -oP "VERSION = '\K[0-9.]+" shared/js/version.js)" >> "$GITHUB_OUTPUT"

      - name: Build the Flatpak bundle
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: desktop/packaging/linux/io.github.vladpereverzyev.leviate.yml
          bundle: leviate-${{ steps.version.outputs.version }}-linux-x64.flatpak
          cache: false
          upload-artifact: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: leviate-*-linux-x64.flatpak
          if-no-files-found: error

  # The MSIX package for the Microsoft Store (product 9P3LPW31MJV0). The Store signs it;
  # it is uploaded by hand in Partner Center, so it is an artifact, not part of the release.
  microsoft-store:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build the Microsoft Store package
        run: node scripts/build-desktop.mjs --appx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store
          path: dist/desktop/leviate-*-windows-store.appx
          if-no-files-found: error

  # The Linux app as a snap for the Snap Store (snap/snapcraft.yaml). On a release tag it is
  # published to the stable channel, once the SNAPCRAFT_STORE_CREDENTIALS secret is set
  # (snapcraft export-login, from the account that owns the name leviate).
  snap:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build the Linux app
        run: node scripts/build-desktop.mjs --dir

      - name: Build the snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      - name: Publish to the Snap Store
        if: github.ref_type == 'tag' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable

  # Leviate for Chrome goes in the release of the app, with its version. The Dentra plugin
  # is built too, to catch mistakes: its zip is uploaded on Dentra, not released here.
  chrome:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build Leviate for Chrome and for Dentra Viewer
        run: |
          node scripts/build-chrome.mjs
          node scripts/build-dentra.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: dist/leviate-chrome-*.zip
          if-no-files-found: error

  release:
    needs: [kind, desktop, chrome, flatpak]
    if: github.ref_type == 'tag' && needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      actions: write    # starts the Website workflow afterwards
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # The MSIX goes to the Microsoft Store only (Partner Center), not to the release.
      - name: Leave out the Microsoft Store package
        run: rm -f dist/*-windows-store.appx

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # The newest release of Leviate for Blender, linked straight from the notes.
          BLENDER="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(any(.assets[]; .name | startswith("leviate-blender-")))][0].tag_name')"
          cat > notes.md <<EOF
          **Leviate runs in the browser, nothing to download:** <https://vladpereverzyev.github.io/leviate/>

          ### Leviate for Desktop

          Your hand on any program, with the webcam or the phone. **3D**: open hand turns, fist
          pans, pinch zooms the 3D program under the cursor. **Mouse**: open hand moves the
          cursor, one finger held still is a left click, two fingers a right click.
          Windows \`leviate-${VER}-windows-x64.exe\`, macOS \`-macos-arm64.dmg\` (Apple silicon) or
          \`-macos-x64.dmg\` (Intel), Linux \`-linux-x64.AppImage\` or \`-linux-x64.flatpak\`.
          On Ubuntu and the other Linux systems with snap it is on the **[Snap Store](https://snapcraft.io/leviate)**: \`sudo snap install leviate\`.
          Guide: [desktop](https://github.com/vladpereverzyev/leviate/tree/main/desktop).

          ### Leviate for Chrome

          The same 3D and Mouse modes in the pages of Chrome, from its side panel.
          Install it from the **[Chrome Web Store](https://chromewebstore.google.com/detail/leviate/moipdbapejodmhhmhhngbcehcgngchlh)**, or by hand:
          unzip \`leviate-chrome-${VER}.zip\`, open \`chrome://extensions\`, turn on Developer mode
          and press Load unpacked. Guide: [chrome-extension](https://github.com/vladpereverzyev/leviate/tree/main/integrations/chrome-extension).

          ### Leviate for Blender

          Leviate for Blender is at version **${BLENDER#v}**, in a release of its own: [${BLENDER}](https://github.com/vladpereverzyev/leviate/releases/tag/${BLENDER}).
          The add-on keeps its own version and gets a new release only when it changes.
          It is also on the official Blender Extensions platform: <https://extensions.blender.org/add-ons/leviate/>.

          The "Source code" archives below are added by GitHub; to use the app open the link above.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true

      # The download page links straight to the files of the latest release: publish it
      # again now that there is a new one.
      - name: Update the download page
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  release-blender:
    needs: [kind, build]
    if: github.ref_type == 'tag' && needs.kind.outputs.blender == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      actions: write    # starts the Website workflow afterwards
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the zips
        uses: actions/download-artifact@v5
        with:
          name: integrations
          path: dist

      - name: Release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ### Leviate for Blender ${VER}

          Download the zip for your system below and drag it into Blender 4.2 or later:
          \`leviate-blender-${VER}-windows-x64.zip\`, \`-macos-arm64.zip\` or \`-linux-x64.zip\`.
          Then open the **Leviate** tab in the 3D view (N), choose the webcam or **Phone** and press
          **Start camera**: the camera and the hand tracking run inside Blender. With **Phone** scan
          the QR code that appears in the 3D view, no app needed. Guide: [integrations/blender](https://github.com/vladpereverzyev/leviate/tree/main/integrations/blender).

          Also on the official Blender Extensions platform: <https://extensions.blender.org/add-ons/leviate/>.

          The web app runs in the browser: <https://vladpereverzyev.github.io/leviate/>.
          The "Source code" archives below are added by GitHub.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.zip
          body_path: notes.md
          fail_on_unmatched_files: true
          make_latest: false

      - name: Update the download page
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
