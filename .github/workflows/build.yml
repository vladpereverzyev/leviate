#
# Builds the integration zips and the desktop app (Windows, macOS, Linux) on every push
# and pull request. On a version tag (v*) it publishes them in a new GitHub Release. Older releases stay, so their download
# counts are kept. The web app itself is not in the release: it runs from
# https://vladpereverzyev.github.io/leviate/.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the add-on code
        run: python -m py_compile integrations/blender/leviate/*.py

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP="v$(grep -oP "VERSION = '\K[0-9.]+" shared/js/version.js)"
          if [ "$APP" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match shared/js/version.js ($APP)"
            exit 1
          fi

      - name: Build Leviate for Blender
        run: python scripts/build-blender.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: integrations
          path: dist/*.zip
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build Leviate for Desktop
        run: node scripts/build-desktop.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/leviate-*.exe
            dist/desktop/leviate-*.dmg
            dist/desktop/leviate-*.AppImage
          if-no-files-found: error

  release:
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          **Leviate runs in the browser, nothing to download:** <https://vladpereverzyev.github.io/leviate/>

          ### Leviate for Blender

          Download the zip for your system below and drag it into Blender 4.2 or later:
          \`leviate-blender-${VER}-windows-x64.zip\`, \`-macos-arm64.zip\` or \`-linux-x64.zip\`.
          Then open the **Leviate** tab in the 3D view (N), choose the webcam or **Phone** and press
          **Start camera**: the camera and the hand tracking run inside Blender. With **Phone** scan
          the QR code that appears in the 3D view, no app needed. Guide: [integrations/blender](https://github.com/vladpereverzyev/leviate/tree/main/integrations/blender).

          ### Leviate for Desktop

          Your hand on any program, with the webcam or the phone. **3D**: open hand turns, fist
          pans, pinch zooms the 3D program under the cursor. **Mouse**: open hand moves the
          cursor, one finger held still is a left click, two fingers a right click.
          Windows \`leviate-${VER}-windows-x64.exe\`, macOS \`-macos-arm64.dmg\` (Apple silicon) or
          \`-macos-x64.dmg\` (Intel), Linux \`-linux-x64.AppImage\`.
          Guide: [desktop](https://github.com/vladpereverzyev/leviate/tree/main/desktop).

          The "Source code" archives below are added by GitHub; to use the app open the link above.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
