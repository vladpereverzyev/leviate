# Copyright (C) 2026 Vladyslav Pereverzyev
#
# Builds the Blender zips, the desktop app (Windows, macOS, Linux) and the Chrome extension
# on every push and pull request. Releases are separate, so each one changes only when it has changed. Both
# are tagged v<version>; the number tells which one it is:
#   the version of shared/js/version.js            Leviate for Desktop, marked as the latest
#   the version of the add-on (blender_manifest)   Leviate for Blender, never marked latest,
#                                                   so the update check of the app finds the app
# The web app itself is not in a release: it runs from https://vladpereverzyev.github.io/leviate/.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  # Checks the syntax of the JavaScript first (every other job waits for this one), then,
  # on a tag: is it the version of the desktop app or of the Blender add-on?
  kind:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.kind.outputs.desktop }}
      blender: ${{ steps.kind.outputs.blender }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Check the JavaScript
        run: node --experimental-vm-modules scripts/check.mjs

      - name: Which release
        id: kind
        run: |
          APP="v$(grep -oP "VERSION = '\K[0-9.]+" shared/js/version.js)"
          ADDON="v$(grep -oP '^version = "\K[0-9.]+' integrations/blender/leviate/blender_manifest.toml)"
          DESKTOP=false; BLENDER=false
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then DESKTOP=true; BLENDER=true; fi
          if [ "$GITHUB_REF_NAME" = "$APP" ]; then DESKTOP=true; fi
          if [ "$GITHUB_REF_NAME" = "$ADDON" ]; then BLENDER=true; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$DESKTOP$BLENDER" = "falsefalse" ]; then
            echo "Tag $GITHUB_REF_NAME matches neither the app ($APP) nor the add-on ($ADDON)"
            exit 1
          fi
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "blender=$BLENDER" >> "$GITHUB_OUTPUT"

  build:
    needs: [kind]
    if: needs.kind.outputs.blender == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check the add-on code
        run: python -m py_compile integrations/blender/leviate/*.py

      - name: Build Leviate for Blender
        run: python scripts/build-blender.py

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrations
          path: dist/*.zip
          if-no-files-found: error

  desktop:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      # macOS: the dmg is signed with the Developer ID certificate (MAC_CERTS) and notarized
      # by Apple, so it opens with no "Open Anyway". Without the secrets it stays unsigned.
      - name: Developer ID keychain
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        id: devid
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          [ -n "$MAC_CERTS" ] || { echo "No MAC_CERTS: unsigned build"; exit 0; }
          KC="$RUNNER_TEMP/devid.keychain"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"Developer ID Application: \(.*\)".*/\1/p' | head -1)
          [ -n "$ID" ] || { echo "No Developer ID Application identity in MAC_CERTS: unsigned build"; exit 0; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"

      - name: Build Leviate for Desktop
        if: steps.devid.outputs.identity == ''
        run: node scripts/build-desktop.mjs

      - name: Build Leviate for Desktop (signed and notarized)
        if: steps.devid.outputs.identity != ''
        env:
          CSC_KEYCHAIN: ${{ steps.devid.outputs.keychain }}
          APPLE_API_KEY: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          node scripts/build-desktop.mjs
          "-c.mac.identity=${{ steps.devid.outputs.identity }}"
          -c.mac.hardenedRuntime=true
          -c.mac.entitlements=packaging/mac/entitlements.mac.plist
          -c.mac.entitlementsInherit=packaging/mac/entitlements.mac.plist
          -c.mac.notarize=true

      - name: Remove the signing secrets from the runner
        if: always() && runner.os == 'macOS'
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/devid.keychain" || true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/leviate-*.exe
            dist/desktop/leviate-*.dmg
            dist/desktop/leviate-*.AppImage
          if-no-files-found: error

  # The Linux app as a Flatpak bundle too (desktop/packaging/linux/io.github.vladpereverzyev.leviate.yml),
  # installed with a double click or flatpak install --user leviate-<version>-linux-x64.flatpak.
  flatpak:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build the Linux app
        run: node scripts/build-desktop.mjs --dir

      - name: Version
        id: version
        run: echo "version=$(grep -oP "VERSION = '\K[0-9.]+" shared/js/version.js)" >> "$GITHUB_OUTPUT"

      - name: Build the Flatpak bundle
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master
        with:
          manifest-path: desktop/packaging/linux/io.github.vladpereverzyev.leviate.yml
          bundle: leviate-${{ steps.version.outputs.version }}-linux-x64.flatpak
          cache: false
          upload-artifact: false

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: leviate-*-linux-x64.flatpak
          if-no-files-found: error

  # The MSIX package for the Microsoft Store (product 9P3LPW31MJV0). The Store signs it, so it
  # is an artifact, not part of the release: the job microsoft-store-submit sends it there.
  microsoft-store:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build the Microsoft Store package
        run: node scripts/build-desktop.mjs --appx

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microsoft-store
          path: dist/desktop/leviate-*-windows-store.appx
          if-no-files-found: error

  # The Linux app as a snap for the Snap Store (snap/snapcraft.yaml). On a release tag it is
  # published to the stable channel, once the SNAPCRAFT_STORE_CREDENTIALS secret is set
  # (snapcraft export-login, from the account that owns the name leviate).
  snap:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build the Linux app
        run: node scripts/build-desktop.mjs --dir

      - name: Build the snap
        id: snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      - name: Publish to the Snap Store
        if: github.ref_type == 'tag' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable

  # Leviate for Chrome goes in the release of the app, with its version. The Dentra plugin
  # is built too, to catch mistakes: its zip is uploaded on Dentra, not released here.
  chrome:
    needs: [kind]
    if: needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Build Leviate for Chrome and for Dentra Viewer
        run: |
          node scripts/build-chrome.mjs
          node scripts/build-dentra.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome
          path: dist/leviate-chrome-*.zip
          if-no-files-found: error

  release:
    needs: [kind, desktop, chrome, flatpak]
    if: github.ref_type == 'tag' && needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      actions: write    # starts the Website workflow afterwards
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      # The MSIX goes to the Microsoft Store only (Partner Center), not to the release.
      - name: Leave out the Microsoft Store package
        run: rm -f dist/*-windows-store.appx

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # The newest release of Leviate for Blender, linked straight from the notes.
          BLENDER="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(any(.assets[]; .name | startswith("leviate-blender-")))][0].tag_name')"
          # What is new: the section of this version in CHANGELOG.md.
          NEWS="$(awk -v v="### ${VER} " 'index($0, v) == 1 { f = 1; next } /^##/ { if (f) exit } f' CHANGELOG.md | sed '/./,$!d')"
          [ -n "$NEWS" ] || { echo "CHANGELOG.md has no section for ${VER}"; exit 1; }
          cat > notes.md <<EOF
          **Leviate runs in the browser, nothing to download:** <https://vladpereverzyev.github.io/leviate/>

          ### What is new in ${VER}

          ${NEWS}

          ### Leviate for Desktop

          Your hand on any program, with the webcam or the phone. **3D**: open hand turns, fist
          pans, pinch zooms the 3D program under the cursor. **Mouse**: open hand moves the
          cursor, one finger held still is a left click, two fingers a right click.
          Windows \`leviate-${VER}-windows-x64.exe\`, macOS (signed and notarized) \`-macos-arm64.dmg\` (Apple silicon) or
          \`-macos-x64.dmg\` (Intel), Linux \`-linux-x64.AppImage\` or \`-linux-x64.flatpak\`.
          On Ubuntu and the other Linux systems with snap it is on the **[Snap Store](https://snapcraft.io/leviate)**: \`sudo snap install leviate\`.
          On Windows it is also on the **[Microsoft Store](https://apps.microsoft.com/detail/9P3LPW31MJV0)**, signed by Microsoft.
          Guide: [desktop](https://github.com/vladpereverzyev/leviate/tree/main/desktop).

          ### Leviate for Chrome and Edge

          **Install it from the Chrome Web Store: <https://chromewebstore.google.com/detail/leviate/moipdbapejodmhhmhhngbcehcgngchlh>**

          **In Edge, from Edge Add-ons: <https://microsoftedge.microsoft.com/addons/detail/leviate/mfgmbobbkgoogpbhobeinkhdhmfiagkl>**

          The same 3D and Mouse modes in the pages of Chrome and Edge (one extension, the same file), from its side panel. To load it by hand
          instead, unzip \`leviate-chrome-${VER}.zip\`, open \`chrome://extensions\`, turn on Developer mode
          and press Load unpacked. Guide: [chrome-extension](https://github.com/vladpereverzyev/leviate/tree/main/integrations/chrome-extension).

          ### Leviate for Blender

          Leviate for Blender is at version **${BLENDER#v}**, in a release of its own: [${BLENDER}](https://github.com/vladpereverzyev/leviate/releases/tag/${BLENDER}).
          The add-on keeps its own version and gets a new release only when it changes.
          It is also on the official Blender Extensions platform: <https://extensions.blender.org/add-ons/leviate/>.

          The "Source code" archives below are added by GitHub; to use the app open the link above.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true

      # The download page links straight to the files of the latest release: publish it
      # again now that there is a new one.
      - name: Update the download page
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  release-blender:
    needs: [kind, build]
    if: github.ref_type == 'tag' && needs.kind.outputs.blender == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      actions: write    # starts the Website workflow afterwards
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: integrations
          path: dist

      - name: Release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ### Leviate for Blender ${VER}

          Download the zip for your system below and drag it into Blender 4.2 or later:
          \`leviate-blender-${VER}-windows-x64.zip\`, \`-macos-arm64.zip\` or \`-linux-x64.zip\`.
          Then open the **Leviate** tab in the 3D view (N), choose the webcam or **Phone** and press
          **Start camera**: the camera and the hand tracking run inside Blender. With **Phone** scan
          the QR code that appears in the 3D view, no app needed. Guide: [integrations/blender](https://github.com/vladpereverzyev/leviate/tree/main/integrations/blender).

          Also on the official Blender Extensions platform: <https://extensions.blender.org/add-ons/leviate/>.

          The web app runs in the browser: <https://vladpereverzyev.github.io/leviate/>.
          The "Source code" archives below are added by GitHub.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          files: dist/*.zip
          body_path: notes.md
          fail_on_unmatched_files: true
          make_latest: false

      - name: Update the download page
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # After a desktop release: Leviate for Chrome to the Chrome Web Store, where it waits for the
  # review of Google. It runs only after an approval in the environment chrome-web-store, which
  # alone holds the OAuth credentials (CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN), and
  # it calls the Chrome Web Store API with curl, no third-party code. Without the secrets the zip
  # stays in the release, to upload by hand.
  chrome-web-store:
    needs: [kind, release]
    if: github.ref_type == 'tag' && needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN != '' }}
    steps:
      - name: Download Leviate for Chrome
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chrome
          path: dist

      - name: Upload to the Chrome Web Store and submit it for review
        if: env.HAS_TOKEN == 'true'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ITEM: publishers/a0835c06-1b5d-4e4a-b918-e060fe96f98d/items/moipdbapejodmhhmhhngbcehcgngchlh
        run: |
          set -euo pipefail
          zip=$(ls dist/leviate-chrome-*.zip | head -1)
          token=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$token"
          api=https://chromewebstore.googleapis.com
          state=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/zip" --data-binary "@$zip" "$api/upload/v2/$ITEM:upload" | tee /dev/stderr | jq -r .uploadState)
          for i in $(seq 30); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            state=$(curl -sS --fail-with-body -H "Authorization: Bearer $token" "$api/v2/$ITEM:fetchStatus" \
              | tee /dev/stderr | jq -r '.lastAsyncUploadState // .uploadState')
          done
          [ "$state" = SUCCEEDED ] || { echo "Upload of $zip: $state"; exit 1; }
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" "$api/v2/$ITEM:publish"

  # After a desktop release: the same zip of Leviate for Chrome to Edge Add-ons, where it waits
  # for the review of Microsoft. It runs only after an approval in the environment edge-add-ons,
  # which alone holds the Publish API credentials of Partner Center (EDGE_CLIENT_ID, EDGE_API_KEY,
  # EDGE_PRODUCT_ID; the key expires, renew it in Partner Center > Edge > Publish API), and it
  # calls the Edge Add-ons API v1.1 with curl, no third-party code.
  # Without the secrets the zip stays in the release, to upload by hand.
  edge-add-ons:
    needs: [kind, release]
    if: github.ref_type == 'tag' && needs.kind.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    environment: edge-add-ons
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.EDGE_API_KEY != '' }}
    steps:
      - name: Download Leviate for Chrome
        if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chrome
          path: dist

      - name: Upload to Edge Add-ons and submit it for review
        if: env.HAS_KEY == 'true'
        env:
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          zip=$(ls dist/leviate-chrome-*.zip | head -1)
          api="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions"
          auth=(-H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID")
          # Both calls answer 202 with the operation in the Location header; the operation
          # says InProgress, then Succeeded or Failed.
          operation() { grep -i '^location:' | tr -d '\r' | sed 's/^[^:]*: *//; s|.*/||'; }
          # A refused call prints the answer of Microsoft, not only its status code.
          call() {
            local body; body=$(mktemp)
            curl -sS --fail-with-body -D "$body.head" -o "$body" "${auth[@]}" "$@" || { cat "$body" >&2; echo >&2; return 1; }
            operation < "$body.head"
          }
          wait_for() {
            local status
            for i in $(seq 60); do
              status=$(curl -sS --fail-with-body "${auth[@]}" "$1" | tee /dev/stderr | jq -r .status)
              [ "$status" = InProgress ] || break
              sleep 10
            done
            [ "$status" = Succeeded ] || { echo "$2: $status"; exit 1; }
          }
          op=$(call -X POST -H "Content-Type: application/zip" -T "$zip" "$api/draft/package")
          wait_for "$api/draft/package/operations/$op" "Upload of $zip"
          notes=$(jq -n --arg v "${GITHUB_REF_NAME}" \
            '{notes: ("Leviate \($v), the same extension as on the Chrome Web Store. Release notes: https://github.com/vladpereverzyev/leviate/releases/tag/\($v)")}')
          op=$(call -X POST -H "Content-Type: application/json" -d "$notes" "$api")
          wait_for "$api/operations/$op" "Submission"

  # After a desktop release: the MSIX package to the Microsoft Store, where it waits for the
  # certification of Microsoft. It runs only after an approval in the environment
  # microsoft-store, which alone holds the credentials of the Microsoft Entra app linked to
  # Partner Center (PARTNER_CENTER_TENANT_ID, PARTNER_CENTER_SELLER_ID, PARTNER_CENTER_CLIENT_ID,
  # PARTNER_CENTER_CLIENT_SECRET; the client secret expires, renew it in the Entra app). It uses
  # the Microsoft Store Developer CLI of Microsoft (MIT). Without the secrets the package stays
  # an artifact of the run, to upload by hand in Partner Center.
  microsoft-store-submit:
    needs: [kind, microsoft-store, release]
    if: github.ref_type == 'tag' && needs.kind.outputs.desktop == 'true'
    runs-on: windows-latest
    environment: microsoft-store
    permissions:
      contents: read
    env:
      HAS_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET != '' }}
    steps:
      - name: Download the Microsoft Store package
        if: env.HAS_SECRET == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: microsoft-store
          path: dist

      - name: Set up the Microsoft Store Developer CLI
        if: env.HAS_SECRET == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Submit it to the Microsoft Store for certification
        if: env.HAS_SECRET == 'true'
        shell: bash
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" \
            --clientId "$CLIENT_ID" --clientSecret "$CLIENT_SECRET"
          # The CLI takes .msix files: an .appx is the same package under its older name.
          appx=$(ls dist/leviate-*-windows-store.appx | head -1)
          cp "$appx" "${appx%.appx}.msix"
          msstore publish "$PWD/dist" --inputFile "${appx%.appx}.msix" --appId 9P3LPW31MJV0 --verbose
