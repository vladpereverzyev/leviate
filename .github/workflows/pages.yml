#
# Publishes the website to https://vladpereverzyev.github.io/leviate/ on every push to main
# that changes it, and again after every release (the release job starts it), so the
# download buttons point to the newest files. scripts/build-web.mjs puts web/ and
# shared/ together in dist/web.

name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "shared/**", "scripts/build-web.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Put the website together
        run: node scripts/build-web.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Pages
        uses: actions/configure-pages@v6

      # Hidden folders are left out by default: .well-known (the AI catalog) must go too.
      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
          include-hidden-files: true

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
