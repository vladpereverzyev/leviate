     The ring around the cursor while a click pose is held. A transparent window that
     lets every click through, moved by main.js. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 72px; height: 72px; }
  .track { stroke: rgba(70, 70, 70, 0.55); }
  .shadow { stroke: rgba(0, 0, 0, 0.35); }
  #arc { transition: stroke-dashoffset 60ms linear; }
  #flash { opacity: 0; transform-origin: 36px 36px; }
  #flash.go { animation: flash 350ms ease-out; }
  @keyframes flash { from { opacity: 0.6; transform: scale(0.6); } to { opacity: 0; transform: scale(1.3); } }
</style>
</head>
<body>
<svg viewBox="0 0 72 72">
  <circle class="shadow" cx="36" cy="36" r="24" fill="none" stroke-width="9"/>
  <circle class="track" cx="36" cy="36" r="24" fill="none" stroke-width="5"/>
  <circle id="arc" cx="36" cy="36" r="24" fill="none" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 36 36)"/>
  <circle id="flash" cx="36" cy="36" r="22"/>
</svg>
<script>
  const COLORS = { left: '#10B279', right: '#E0B85A' };
  const arc = document.getElementById('arc');
  const flash = document.getElementById('flash');
  window.ring.onState(({ mode, progress }) => {
    arc.style.stroke = COLORS[mode] || '#fff';
    arc.style.strokeDashoffset = String(150.8 * (1 - progress));
  });
  window.ring.onFlash((mode) => {
    flash.style.fill = COLORS[mode] || '#fff';
    flash.classList.remove('go');
    void flash.getBoundingClientRect();
    flash.classList.add('go');
  });
</script>
</body>
</html>
